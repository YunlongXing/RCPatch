[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpatch"
version = "0.1.0"
description = "RCPatch: root-cause-guided patch generation for C/C++ vulnerabilities"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "RCPatch Research Prototype" }
]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.scripts]
rcpatch = "rcpatch.cli:main"
bugrc = "rcpatch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
